package:
  name: garage
  version: 2.3.0
  epoch: 0
  description: S3-compatible object store for self-hosted deployments
  copyright:
    - license: AGPL-3.0-only

environment:
  contents:
    repositories:
      - &wolfi-repository https://packages.wolfi.dev/os
    keyring:
      - &wolfi-keyring https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - protobuf

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/deuxfleurs-org/garage
      tag: v${{package.version}}

  - uses: cargo/build
    with:
      output: garage
      opts: |
        --release \
        --locked \
        --bin garage

  - uses: vegops/rootfs

  - uses: dotnet/entrypoint

  - uses: strip

update:
  enabled: true
  github:
    identifier: deuxfleurs-org/garage
    use-tag: true
    strip-prefix: v

test:
  environment:
    contents:
      repositories:
        - *wolfi-repository
      keyring:
        - *wolfi-keyring
      packages:
        - busybox
        - ${{package.name}}=${{package.full-version}}
  pipeline:
    - runs: |
        garage --version
        test -x /usr/bin/entrypoint
        test -f /usr/share/garage/garage.toml
        mkdir -p /garage/etc /garage/var/meta /garage/var/data
        entrypoint --version
        test "$(stat -c '%a' /garage/etc/garage.toml)" = 600
        grep -Eq '^rpc_secret = "[a-f0-9]{64}"$' /garage/etc/garage.toml
        grep -Eq '^admin_token = "[a-f0-9]{64}"$' /garage/etc/garage.toml