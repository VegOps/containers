contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - tzdata
    - garage

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: "65532"

entrypoint:
  command: /usr/bin/entrypoint

work-dir: /

volumes:
  - /garage/etc
  - /garage/var

paths:
  - path: /garage
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700
  - path: /garage/etc
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700
  - path: /garage/var
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700
  - path: /garage/var/meta
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700
  - path: /garage/var/data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700

environment:
  GARAGE_CONFIG_FILE: /garage/etc/garage.toml
  RUST_BACKTRACE: "1"
  RUST_LOG: garage=info

annotations:
  org.opencontainers.image.title: "garage"
  org.opencontainers.image.description: "Hardened Garage S3 object store image built on Wolfi with daily CVE patches"
  org.opencontainers.image.url: "https://github.com/vegops/containers"
  org.opencontainers.image.source: "https://github.com/vegops/containers/tree/main/garage"
  org.opencontainers.image.licenses: "AGPL-3.0-only"

archs:
  - x86_64
  - aarch64

layering:
  strategy: origin